[project]
name = "sysman-ops-agent"
version = "0.1.0"
description = "SysMan Operations Agent App using ADK and dynamic skills"
authors = [
    {name = "Your Name", email = "your@email.com"},
]
dependencies = [
    "google-adk[gcp,otel-gcp,agent-identity]>=2.6.2,<3.0.0",
    "google-cloud-discoveryengine>=0.11.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.28.0",
    "a2a-sdk[http-server]~=0.3.22",
    "aiohttp>=3.13.4",
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi>=0.115.8,<1.0.0",
    "gcsfs>=2024.11.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "python-multipart>=0.0.20,<1.0.0",
    "sqlalchemy>=2,<3",
    "uvicorn~=0.34.0",
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
